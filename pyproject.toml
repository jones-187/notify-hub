[project]
name = "notify-hub"
version = "0.1.0"
description = "自建的提醒与通知服务"
requires-python = ">=3.11"
dependencies = [
    "apprise>=2,<3",
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "starlette>=1,<2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notify_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
