services:
  notify-hub:
    build: .
    image: notify-hub:latest
    environment:
      # 令牌只从环境变量传入。compose 自动加载同目录的 .env（见 .env.example）。
      # :? 让 NOTIFY_TOKEN 未设置或为空时 compose 直接报错，绝不回退到默认值。
      NOTIFY_TOKEN: "${NOTIFY_TOKEN:?请复制 .env.example 为 .env，并填上生成的令牌}"
      # 数据库文件落在挂载卷 /data 里，容器重建后数据还在。
      NOTIFY_DB: /data/notify.db
      # 两个端口在容器内固定为 8080（公网，只挂 MCP）与 8081（内网）。
      MCP_PORT: "8080"
      INTERNAL_PORT: "8081"
      # 路径前缀（可选）。留空则路径就是 /mcp、/notify 等；
      # 设成 /notify-hub 则整体前移，给反向代理预留位置。见 .env.example。
      PATH_PREFIX: "${PATH_PREFIX:-}"
    ports:
      # 公网端口：只挂 MCP（/mcp）。内网穿透只映射这一条。
      # 宿主机的端口号可用 .env 里的 MCP_HOST_PORT 覆盖（默认 8080）。
      - "${MCP_HOST_PORT:-8080}:8080"
      # 内网端口：/notify、/healthz、/messages。只给本机与局域网用，
      # 不要经内网穿透映射到公网。同样可用 INTERNAL_HOST_PORT 覆盖（默认 8081）。
      - "${INTERNAL_HOST_PORT:-8081}:8081"
    volumes:
      # 数据目录挂到宿主机；数据库文件在 ./data/notify.db，备份就是复制这个文件。
      - ./data:/data
    healthcheck:
      # 健康检查免令牌；用容器自带的 python 打，不额外装 curl。
      # 路径要把 PATH_PREFIX 拼上，且用服务自己那套规范化，
      # 免得 .env 里的写法跟服务认的不一样就健康不起来。
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; from notify_hub.paths import normalize_prefix; urllib.request.urlopen('http://127.0.0.1:8081' + normalize_prefix(os.environ.get('PATH_PREFIX', '')) + '/healthz')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Docker 默认的 json-file 驱动不会轮转日志，长期跑会把磁盘写满。
    # 单个文件 10 MB，最多保留 3 份，超过就丢弃最旧的。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
